name: Feature request
description: Propose a capability or improvement with a concrete use case.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please search existing requests first. Describe the problem so alternatives can be considered.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to accomplish, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example use case
      description: Give a concrete workflow or command example and its desired outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility concerns
      description: Note any effects on existing commands, configuration, or deployments.
